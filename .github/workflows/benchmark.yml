name: Performance Benchmark Report

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 1'   # Every Monday 2am UTC

jobs:
  benchmark:
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pydantic typing-extensions

    - name: Run Sync Router Benchmark
      run: |
        python -c "
        import time
        import sys
        sys.path.insert(0, '.')
        from agentic_routing import AgentRouter, SafetyGuardrail
        router = AgentRouter()
        guardrail = SafetyGuardrail()

        # Warmup
        for _ in range(10):
            router.route_query('test')

        # Benchmark: 1000 sync routes
        start = time.perf_counter()
        for _ in range(1000):
            result = router.route_query('vector database pricing query')
        elapsed = time.perf_counter() - start
        avg_ms = (elapsed / 1000) * 1000
        print(f'Sync Router  | 1000 routes | Total: {elapsed:.3f}s | Avg: {avg_ms:.4f}ms/route')

        # Benchmark: 1000 safety audits
        start = time.perf_counter()
        for _ in range(1000):
            guardrail.audit('This is a safe response text string.')
        elapsed = time.perf_counter() - start
        avg_ms = (elapsed / 1000) * 1000
        print(f'SafetyAudit  | 1000 audits | Total: {elapsed:.3f}s | Avg: {avg_ms:.4f}ms/audit')
        "

    - name: Run Async Batch Benchmark
      run: |
        python -c "
        import asyncio, time, sys
        sys.path.insert(0, '.')
        from agentic_routing import AsyncAgentRouter

        async def bench():
            async_router = AsyncAgentRouter()
            queries = ['query ' + str(i) for i in range(100)]
            start = time.perf_counter()
            results = await async_router.route_batch_async(queries)
            elapsed = time.perf_counter() - start
            print(f'AsyncRouter  | 100 batch queries | Total: {elapsed:.3f}s | Avg: {(elapsed/100)*1000:.4f}ms/query')

        asyncio.run(bench())
        "
