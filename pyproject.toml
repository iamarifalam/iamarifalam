[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-routing-framework"
version = "1.0.0"
description = "A high-performance, open-source multi-agent routing framework with RAG context validation and safety guardrails."
readme = "README.md"
authors = [
    { name = "Arif Alam", email = "iamarifalam@gmail.com" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["ai", "agents", "langgraph", "rag", "guardrails", "routing", "llm"]
dependencies = [
    "pydantic>=2.0.0",
    "typing-extensions>=4.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
agentic-cli = "agentic_routing.cli:main"

[project.urls]
Homepage = "https://github.com/iamarifalam/iamarifalam"
Documentation = "https://github.com/iamarifalam/iamarifalam#readme"
Repository = "https://github.com/iamarifalam/iamarifalam.git"
Issues = "https://github.com/iamarifalam/iamarifalam/issues"
Changelog = "https://github.com/iamarifalam/iamarifalam/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/iamarifalam/iamarifalam/blob/main/ROADMAP.md"

# ==============================================================================
# Tool Configurations — enforced in CI
# ==============================================================================

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["agentic_routing"]
omit = ["tests/*", "**/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

